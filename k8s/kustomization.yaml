# Kustomize (built into kubectl) assembles these files into one deployment: kubectl apply -k k8s
# Use k8s/deploy.sh, which also creates the Keycloak realm ConfigMap from keycloak/realm-vitalstream.json.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vitalstream

resources:
  - namespace.yaml
  - app-config.yaml
  - postgres.yaml
  - kafka.yaml
  - schema-registry.yaml
  - keycloak.yaml
  - api-service.yaml
  - vitals-processor.yaml
  - vitals-query.yaml

# Database credentials as a Secret. Kustomize appends a hash of the contents to the name
# (db-credentials-<hash>) and updates every reference, so changing a value rolls out new pods.
# Committing secret values like this is only acceptable for local development; real deployments keep them
# out of git (sealed secrets, an external secrets manager, or values injected by the CI/CD pipeline).
secretGenerator:
  - name: db-credentials
    literals:
      - DB_USER=vitalstream
      - DB_PASSWORD=vitalstream
