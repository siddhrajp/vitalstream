spring:
  application:
    name: api-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Where tokens come from. On the first request Spring reads
          # <issuer-uri>/.well-known/openid-configuration to find Keycloak's public keys (JWKS), caches
          # them, and from then on checks each token's signature locally. A token is accepted only if
          # its "iss" claim equals this URL and it hasn't expired.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/vitalstream}
          # ...and only if its "aud" claim includes this: tokens issued for other applications in the
          # same realm are rejected.
          audiences: vitalstream-api
  grpc:
    server:
      port: 9090   # gRPC for devices; REST stays on 8080
      # On shutdown, stop accepting new calls, give open calls this long to finish, then cancel them.
      # Device streams never "finish" on their own, so without a limit a stopping server would keep
      # serving them indefinitely and a new version couldn't take over. Cancelled clients reconnect.
      shutdown-grace-period: 5s
      keep-alive:
        # Clients may send keepalive pings (to detect dead connections) at most this often. The default
        # is 5 minutes; a client pinging more often gets disconnected with "too_many_pings". The simulator
        # pings every 5s so the demo detects a hung server quickly; real devices would ping every minute or so.
        permit-time: 4s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/vitalstream}
    username: ${DB_USER:vitalstream}
    password: ${DB_PASSWORD:vitalstream}
  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match the tables.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      # Apply settings from NewTopic beans (e.g. retention) to topics that already exist, not only new ones.
      modify-topic-configs: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Writes the value as Avro binary, prefixed with the id of its schema in Schema Registry.
      # On the first send it registers the schema (or finds the existing id) and caches it.
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      # Wait for the broker to confirm the write before treating it as sent.
      acks: all
      properties:
        # Fail fast instead of hanging for the 60s+ defaults when Kafka is down.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8086}

vitalstream:
  kafka:
    topics:
      # A new topic: vitals.readings holds JSON messages that an Avro consumer can't read.
      readings: vitals.readings.avro

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
