spring:
  application:
    name: api-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/vitalstream}
    username: ${DB_USER:vitalstream}
    password: ${DB_PASSWORD:vitalstream}
  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match the tables.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Key and value are sent as plain strings; we turn events into JSON ourselves (Avro replaces this in Phase 3).
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Wait for the broker to confirm the write before treating it as sent.
      acks: all
      properties:
        # Fail fast instead of hanging for the 60s+ defaults when Kafka is down.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

vitalstream:
  kafka:
    topics:
      readings: vitals.readings

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
