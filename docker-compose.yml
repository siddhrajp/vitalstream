services:
  postgres:
    image: postgres:16
    container_name: vitalstream-postgres
    environment:
      POSTGRES_DB: vitalstream
      POSTGRES_USER: vitalstream
      POSTGRES_PASSWORD: vitalstream
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (5432 is taken by a local Postgres)
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalstream -d vitalstream"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
