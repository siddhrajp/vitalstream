services:
  postgres:
    image: postgres:16
    container_name: vitalstream-postgres
    environment:
      POSTGRES_DB: vitalstream
      POSTGRES_USER: vitalstream
      POSTGRES_PASSWORD: vitalstream
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (5432 is taken by a local Postgres)
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalstream -d vitalstream"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode: the same process is both broker (stores messages)
  # and controller (manages cluster metadata), so no ZooKeeper is needed.
  kafka:
    image: apache/kafka:4.3.1
    container_name: vitalstream-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners, because "where is Kafka?" has a different answer depending on who asks:
      #   INTERNAL  -> other containers (kafka-ui) reach it as kafka:19092
      #   EXTERNAL  -> apps on your Mac (api-service via ./mvnw) reach it as localhost:9092
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # One broker, so internal topics can only have one copy (production uses 3).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics must be created on purpose, so a typo in a topic name fails loudly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Web UI for browsing topics, partitions, messages, and consumer groups: http://localhost:8085
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: vitalstream-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: vitalstream
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
